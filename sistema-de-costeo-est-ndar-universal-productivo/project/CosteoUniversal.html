<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CosteoUniversal</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── DARK THEME (default) ─────────────────────────────── */
    :root, [data-theme="dark"] {
      --bg-primary: #0F1117;
      --bg-secondary: #161B27;
      --bg-tertiary: #1E2535;
      --border-subtle: #2A3347;
      --border-mid: #384258;
      --text-primary: #E8ECF4;
      --text-secondary: #8B95A8;
      --text-tertiary: #525E73;
      --accent-industrial: #3B82F6;
      --accent-agro: #22C55E;
      --accent-warning: #F59E0B;
      --accent-danger: #EF4444;
      --accent-success: #10B981;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
      --shadow-lg: 0 16px 48px rgba(0,0,0,0.6);
    }

    /* ── LIGHT THEME ──────────────────────────────────────── */
    [data-theme="light"] {
      --bg-primary: #F8FAFC;
      --bg-secondary: #FFFFFF;
      --bg-tertiary: #F1F5F9;
      --border-subtle: #E2E8F0;
      --border-mid: #CBD5E1;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-tertiary: #94A3B8;
      --accent-industrial: #2563EB;
      --accent-agro: #16A34A;
      --accent-warning: #D97706;
      --accent-danger: #DC2626;
      --accent-success: #059669;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
      --shadow-lg: 0 16px 48px rgba(0,0,0,0.18);
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      transition: background 0.2s, color 0.2s;
    }
    #root { height: 100vh; display: flex; flex-direction: column; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 2px; }
    input, select, textarea, button { font-family: 'IBM Plex Sans', sans-serif; }
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      background: var(--bg-tertiary); height: 3px; border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      background: var(--accent-industrial); border-radius: 50%; cursor: pointer;
    }
    * { -webkit-font-smoothing: antialiased; }
    select {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    textarea {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
      resize: vertical;
      width: 100%;
      line-height: 1.5;
    }
    textarea:focus { border-color: var(--accent-industrial); }

    /* Theme transition */
    *, *::before, *::after { transition: background-color 0.2s, border-color 0.2s; }
    /* But not transform/opacity — that'd break animations */
    [style*="transform"], [style*="opacity"] { transition: none; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/components/ui.jsx"></script>
  <script type="text/babel" src="src/layouts/AppLayout.jsx"></script>
  <script type="text/babel" src="src/pages/Onboarding.jsx"></script>
  <script type="text/babel" src="src/pages/Dashboard.jsx"></script>
  <script type="text/babel" src="src/pages/FichaCosto.jsx"></script>
  <script type="text/babel" src="src/pages/Insumos.jsx"></script>
  <script type="text/babel" src="src/pages/Productos.jsx"></script>
  <script type="text/babel" src="src/pages/Proveedores.jsx"></script>
  <script type="text/babel" src="src/pages/Unidades.jsx"></script>
  <script type="text/babel" src="src/pages/Categorias.jsx"></script>
  <script type="text/babel" src="src/pages/Historial.jsx"></script>
  <script type="text/babel" src="src/pages/Configuracion.jsx"></script>
  <script type="text/babel" src="src/pages/agro/Lotes.jsx"></script>
  <script type="text/babel" src="src/pages/agro/Bitacora.jsx"></script>
  <script type="text/babel" src="src/pages/agro/Liquidacion.jsx"></script>
  <script type="text/babel" src="src/App.jsx"></script>
</body>
</html>
